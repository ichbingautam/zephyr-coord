# Default values for ZephyrCoord Helm chart
# Override these values using --set or a custom values.yaml file

# Number of replicas (should be odd: 3, 5, or 7 for quorum)
replicaCount: 3

# Container image configuration
image:
  repository: ghcr.io/ichbingautam/zephyr-coord
  tag: latest
  pullPolicy: Always

# Image pull secrets for private registries
imagePullSecrets: []

# Override chart name
nameOverride: ""
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

# RBAC configuration
rbac:
  create: true

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Resource requests and limits
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Persistent storage configuration
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  annotations: {}

# ZephyrCoord configuration
config:
  tickTime: 2000
  initLimit: 10
  syncLimit: 5
  maxClientCnxns: 60
  snapCount: 100000

# Network Policy configuration
networkPolicy:
  enabled: true
  # Allow client connections from all namespaces
  allowExternalClients: true

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod anti-affinity (enabled by default for HA)
podAntiAffinity:
  enabled: true
  # Options: hard, soft
  type: hard

# Service configuration
service:
  # Client service type (LoadBalancer for external access)
  client:
    type: LoadBalancer
    port: 2181
    annotations: {}
  # Admin service type
  admin:
    type: ClusterIP
    port: 8080
    annotations: {}

# Probes configuration
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

# Init container configuration
initContainer:
  image: busybox:1.36
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
