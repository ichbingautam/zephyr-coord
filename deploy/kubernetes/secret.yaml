---
# Secret for sensitive ZephyrCoord configuration
# NOTE: In production, use external secret management (AWS Secrets Manager, Vault, etc.)
# This is a placeholder template - replace with actual secrets before applying
apiVersion: v1
kind: Secret
metadata:
  name: zephyr-coord-secrets
  namespace: zephyr-coord
  labels:
    app: zephyr-coord
type: Opaque
data:
  # Base64-encoded placeholder values - replace with actual secrets
  # echo -n "your-value" | base64
  # Example: admin-password: cGFzc3dvcmQ=  # "password" in base64
stringData:
  # Using stringData for easier readability in templates
  # These will be automatically base64 encoded by Kubernetes
  # Uncomment and configure as needed:
  #
  # admin-username: "admin"
  # admin-password: "changeme"
  #
  # For TLS (if enabling mutual TLS):
  # tls.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # tls.key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----
  placeholder: "configure-secrets-before-production"
