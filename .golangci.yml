run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell

linters-settings:
  govet:
    enable-all: false
    enable:
      - assign
      - atomic
      - bools
      - buildtag
      - copylocks
      - httpresponse
      - loopclosure
      - lostcancel
      - nilfunc
      - printf
      - stringintconv
      - unmarshal
      - unreachable
      - unsafeptr
    # Disable fieldalignment - too noisy for initial development
    disable:
      - fieldalignment
      - shadow
      - stdmethods

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/ichbingautam/zephyr-coord

  misspell:
    locale: US

  errcheck:
    # Ignore specific functions commonly used without error checks
    exclude-functions:
      - fmt.Fprintf
      - fmt.Printf
      - fmt.Fprint
      - io.WriteString
      - (*bytes.Buffer).WriteString
      - (*bytes.Buffer).WriteByte
      - (*bufio.Writer).Flush
      - (*bufio.Writer).WriteByte
      - (*os.File).Close
      - (*os.File).Sync
      - (*compress/gzip.Writer).Close
      - (*compress/gzip.Reader).Close
      - (net.Conn).Close
      - (net.Conn).SetReadDeadline
      - (net.Conn).SetWriteDeadline
      - (net.Listener).Close

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10

  exclude-rules:
    # Ignore test files for some linters
    - path: _test\.go
      linters:
        - errcheck
        - unused

    # Ignore benchmark files
    - path: _bench_test\.go
      linters:
        - errcheck

    # Ignore generated files
    - path: \.pb\.go
      linters:
        - all

    # Ignore specific patterns
    - linters:
        - staticcheck
      text: "SA9003" # Empty branch

    - linters:
        - staticcheck
      text: "SA6002" # Pointer-like argument

    - linters:
        - staticcheck
      text: "SA4017" # Ignored return value
